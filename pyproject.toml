[project]
name = "thinkific-tools"
version = "0.2.0"
description = "Export a Thinkific course site and import it into Frappe LMS."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = [
    "requests",
    "pyyaml",
    "playwright",   # only the exporter needs this; harmless for the importer
]

[project.optional-dependencies]
# Only needed for `frappe_import.py --video-mode vimeo`.
vimeo = ["PyVimeo"]

# Tooling for local dev / CI (installed with `uv sync --group dev`).
[dependency-groups]
dev = ["ruff"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Pragmatic set: pycodestyle errors/warnings, Pyflakes, import sorting, bugbear.
# Deliberately not enabling pyupgrade (UP) to avoid churn on the existing code.
select = ["E", "F", "W", "I", "B"]
# E501 (line length) is intentionally off: the scripts embed long help strings,
# URLs and a markdown FORMAT spec that read better unwrapped.
ignore = ["E501"]

[project.scripts]
thinkific-export = "thinkific_export:main"
frappe-import = "frappe_import:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The project is two self-contained single-file modules at the repo root, not a
# package directory — tell hatchling to ship exactly those two files.
[tool.hatch.build.targets.wheel]
include = ["thinkific_export.py", "frappe_import.py"]

[tool.hatch.build.targets.sdist]
include = [
    "thinkific_export.py",
    "frappe_import.py",
    "README.md",
    "docs/",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "LICENSE",
]
